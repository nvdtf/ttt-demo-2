<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic-Tac-Toe</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    #board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0;
    }

    .cell {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      cursor: pointer;
      border: 1px solid #333;
      background: none;
      user-select: none;
    }

    #status {
      font-size: 1.4rem;
      margin: 0 0 1rem 0;
      text-align: center;
      min-height: 2rem;
    }

    #new-game-btn {
      margin-top: 1.5rem;
      padding: 0.6rem 1.5rem;
      font-size: 1.1rem;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="status"></div>
  <div id="container"></div>
  <button id="new-game-btn" type="button">New Game</button>
  <script>
    const WINNING_COMBOS = [
      [0, 1, 2], // top row
      [3, 4, 5], // middle row
      [6, 7, 8], // bottom row
      [0, 3, 6], // left column
      [1, 4, 7], // middle column
      [2, 5, 8], // right column
      [0, 4, 8], // diagonal top-left to bottom-right
      [2, 4, 6], // diagonal top-right to bottom-left
    ];

    let board = ['', '', '', '', '', '', '', '', ''];
    let currentPlayer = 'X';
    let gameOver = false;
    let winner = null;
    let winningCells = null;

    function renderBoard() {
      let boardEl = document.getElementById('board');
      if (!boardEl) {
        boardEl = document.createElement('div');
        boardEl.id = 'board';
        document.getElementById('container').appendChild(boardEl);
      }
      boardEl.innerHTML = '';
      for (let i = 0; i < 9; i++) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.textContent = board[i];
        cell.addEventListener('click', function() {
          handleCellClick(i);
        });
        boardEl.appendChild(cell);
      }
    }

    function handleCellClick(index) {
      if (gameOver || board[index] !== '') {
        return;
      }
      board[index] = currentPlayer;
      checkWin();
      checkDraw();
      if (!gameOver) {
        currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
      }
      renderBoard();
    }

    function checkWin() {
      for (const combo of WINNING_COMBOS) {
        if (board[combo[0]] === currentPlayer &&
            board[combo[1]] === currentPlayer &&
            board[combo[2]] === currentPlayer) {
          gameOver = true;
          winner = currentPlayer;
          winningCells = combo;
          return;
        }
      }
    }

    function checkDraw() {
      if (gameOver) {
        return;
      }
      if (board.every(function(cell) { return cell !== ''; })) {
        gameOver = true;
      }
    }

    function initGame() {
      board = ['', '', '', '', '', '', '', '', ''];
      currentPlayer = 'X';
      gameOver = false;
      winner = null;
      winningCells = null;
      renderBoard();
    }

    document.getElementById('new-game-btn').addEventListener('click', initGame);
    document.addEventListener('DOMContentLoaded', initGame);
  </script>
</body>
</html>
